# Builds the site and pushes the finished files to the gh-pages branch on every push to main.
# Requires Settings → Pages → Source: "Deploy from a branch", branch gh-pages, folder / (root).
# (The newer "GitHub Actions" Pages source kept timing out for this repo, so branch publishing is used.)
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # also writes .nojekyll, so GitHub serves the _app folder instead of skipping it
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
